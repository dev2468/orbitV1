# Deepgram nova-3 keyterm prompting list — requirement 5 of the Deepgram
# migration. Up to 100 terms / 500 tokens total, streaming-capable, lifts
# keyword recall up to 90% per Deepgram's own docs. Loaded fresh on every
# voice runtime start, so it grows without a code change — just add a line.
#
# Wire syntax (handled in transcriber.py, not here): the parameter is
# repeated once per term (?keyterm=a&keyterm=b), spaces URL-encoded, no
# weights/intensifiers — keyterm prompting doesn't support them (that's
# the older, deprecated "keywords" feature's syntax, not this one).
#
# Seeded with what this assistant actually hears: shopping sites, this
# project's own name, and multi-word brand/product names most likely to
# get mangled by a general-purpose model. Add rupee/lakh amounts, other
# app or project names, and anything else that keeps getting misheard.
keyterms:
  - Flipkart
  - Croma
  - Pixel
  - NIDRA
  - Orbit
  - rupee
  - rupees
  - lakh
  - lakhs
  - crore
