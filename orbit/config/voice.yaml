# Voice runtime config — Section 2/9/11 of the architecture spec.
#
# hotkey: push-to-talk combo, held to record, released to send. Deliberately
# NOT voice-activity detection — push-to-talk removes the "when did they
# stop speaking" problem entirely and can't false-trigger on a shared
# family machine (Section 14.10's multi-person-household concern). Same
# reason Deepgram's endpointing/speech_final are ignored below.
hotkey: "ctrl+space"

# tts_enabled: speak the final answer aloud when a task completes.
tts_enabled: true

# --- Speech-to-text: Deepgram nova-3 streaming (replaces Moonshine) -------
#
# Moonshine's 245M model wasn't accurate enough on accented English — a
# model-capacity problem, not something a different streaming architecture
# fixes. Deepgram gives a $200 free credit (~690 hours of nova-3 streaming
# at current pricing) and is a production-grade hosted alternative.
#
# deepgram_model / deepgram_language: nova-3 multilingual (language=multi)
# is the default because the user speaks Indian English and may mix Hindi
# mid-sentence — 2026 benchmarking found monolingual models posting
# 15-20% real-world WER on Hindi-English code-switching despite ~5% on
# monolingual benchmarks. Both variants are configurable here specifically
# so they can be A/B'd on real recordings (requirement 4) — set
# deepgram_language to "en" for the monolingual comparison run.
deepgram_model: "nova-3"
deepgram_language: "multi"

# deepgram_cost_per_minute_usd: streaming multilingual list price as of
# this build (Aug 2026) — used to compute cost_usd per transcription
# (audio-seconds streamed / 60 * this rate). Update if Deepgram's pricing
# changes; this is NOT fetched live.
deepgram_cost_per_minute_usd: 0.0058

# daily_cost_cap_usd: hard stop, checked BEFORE starting a new
# transcription (orbit/voice/runtime.py), not after. This is the first
# real per-use spend in the system — the $200 free credit is generous but
# not infinite, and a silent drain defeats the point of tracking cost_usd
# at all.
daily_cost_cap_usd: 2.00

# keyterms live in orbit/config/keyterms.yaml, not here, so the list can
# grow without touching this file's other settings.

# --- Fast release + persistent connection (Aug-2026 latency work) ---------
#
# The Deepgram socket is now opened ONCE at startup and held open for the
# whole session (KeepAlive every keepalive_interval_s), so a hotkey press no
# longer pays a cold DNS+TLS+WS handshake — that handshake, ~0.8-1.5s from
# India, WAS the "press, pause, then speak" symptom. On key-release we send
# Finalize and collect the tail, but we do NOT send CloseStream or tear the
# socket down (it stays warm for the next press).
#
# flush_timeout_s: hard cap on waiting for the tail after Finalize. Since we
# no longer wait on a teardown round trip, this is short. Once is_final
# segments start arriving we actually return finalize_quiet_s after the last
# one; the cap only bites on a silent release. NOTE: on a high-RTT link
# (India->US ~200-300ms each way) the Finalize->last-is_final round trip can
# approach this cap — watch item 1's "Finalize -> last is_final" number and
# raise flush_timeout_s / finalize_quiet_s if the tail is getting clipped.
flush_timeout_s: 1.0
finalize_quiet_s: 0.25

# keepalive_interval_s: send {"type":"KeepAlive"} this often to stop Deepgram
# closing the idle socket (NET-0001 after ~10s). KeepAlive is a control frame,
# not audio — it is not billed and produces no transcription event.
keepalive_interval_s: 5.0

# Background reconnect: a dropped-but-previously-good socket reconnects
# immediately; a connect that keeps failing backs off from _initial to _max
# and resets on the first success.
reconnect_backoff_initial_s: 0.5
reconnect_backoff_max_s: 8.0

# capture_blocksize: audio frame size in samples at 16kHz. 512 = 32ms, inside
# requirement 4's 20-50ms band (was 1024 = 64ms). Smaller frames reach
# Deepgram sooner at the cost of more callbacks.
capture_blocksize: 512

# --- Rolling mic pre-buffer (requirement 3) -------------------------------
#
# PRIVACY: when pre_buffer_enabled is true the microphone is held open the
# WHOLE time the voice runtime is running, and the last pre_buffer_ms of audio
# is kept in a local ring buffer that is CONSTANTLY OVERWRITTEN and NEVER
# transmitted — it is prepended to the stream only when you actually press the
# hotkey. This is what lets you speak as (or just before) you press instead of
# the learned "click, wait, speak". Nothing leaves the machine from the ring,
# but because the mic is open continuously this is a deliberate, visible
# choice: set pre_buffer_enabled to false on a shared machine to go back to
# capturing only while the key is held.
pre_buffer_enabled: true
pre_buffer_ms: 500

# perf_logging: print per-utterance stage timings (requirement 1) to the log —
# hotkey->ws-ready, ->first-frame, ->first-interim, release->Finalize,
# Finalize->last-is_final, release->transcript. Turn off once tuned.
perf_logging: true

# --- Barge-in: interrupt a spoken reply by talking over it (hands-free) ----
#
# While Orbit is actually speaking a reply, a LOCAL energy check watches the
# mic; if you start talking over her (sustained speech above the speaker-bleed
# level) it stops playback immediately. This is local only — nothing is
# transcribed or sent anywhere, and it does NOT start a new command for you
# (you still press the hotkey to speak the next one). It just shuts her up.
#
# PRIVACY: like pre_buffer, this keeps the microphone open while the runtime is
# running (it has to hear you over the reply). Set barge_in_enabled: false to
# have the mic open only while the hotkey is held.
#
# TUNING (the speaker case is device/volume dependent — headphones "just work"
# because there's no bleed): if she cuts herself off, RAISE energy_ratio or
# min_ms. If barge-in is hard to trigger, LOWER them. abs_floor stops it firing
# in a silent room / on headphones where the baseline sits near zero.
barge_in_enabled: true
barge_in_energy_ratio: 3.0
barge_in_min_ms: 300
barge_in_start_grace_ms: 350
barge_in_abs_floor: 0.01

# fallback_model_size: faster-whisper model used ONLY when Deepgram's
# WebSocket won't connect or drops mid-utterance (requirement 6) — not
# independently benchmarked here for accented-English accuracy, this is
# the offline safety net, not a claim it matches nova-3.
fallback_model_size: "small"

# --- Text-to-speech: Kokoro-82M (replaces Moonshine's TTS) ----------------
#
# NOT Piper: the actively-maintained piper-tts PyPI package relicensed to
# GPL-3.0-or-later in Oct 2025 (repo moved to OHF-Voice/piper1-gpl); the
# only MIT-licensed Piper is the now-archived, unmaintained original, and
# even that depended on a GPL espeak-ng wrapper for phonemization. Do not
# "helpfully" swap back to piper-tts without re-reading that history.
#
# Kokoro (Apache-2.0 weights + code) runs via an isolated Python 3.11
# subprocess (orbit/voice/tts_worker.py, venv_tts/) because misaki[en] —
# Kokoro's G2P dependency — has never published a version supporting
# Python 3.13+, and this project's own venv is 3.13. See
# orbit/voice/tts.py's module docstring for the subprocess protocol.
#
# tts_voice: same voice already benchmarked for latency in the Moonshine
# build (there it was accessed as "kokoro_af_heart"; Kokoro's own voice
# catalog calls it "af_heart" — American female, "heart").
tts_voice: "af_heart"

# tts_disable_espeak_fallback: Kokoro's own KPipeline tries to wire up an
# espeak-ng-based OOV fallback by default (misaki.espeak.EspeakFallback)
# and only silently no-ops if espeak-ng's native library isn't found on
# the machine — the exact "activates only on rare inputs, easy to miss
# later" trap. tts_worker.py does NOT rely on that absence; it explicitly
# constructs the G2P with fallback=None whenever this is true, so an
# unrelated future espeak-ng install on this machine can't silently pull
# a GPL code path back in. Leave this true.
tts_disable_espeak_fallback: true

# Input/output device selection. null = system default. Set to a substring
# of a device name (case-insensitive) or a PortAudio index to pin one.
input_device: null
output_device: null
