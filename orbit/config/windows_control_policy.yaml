# Section 7 windows-control policy — Prompt 1 of "Claude Code Prompts -
# Building the MCP Tool Layer.md". Read at call time by
# orbit.policy.load_windows_control_policy; not cached, same convention as
# every other YAML in this directory.
#
# There is no scoped-roots equivalent here the way filesystem has one —
# mouse/keyboard input lands wherever the real OS focus is, and that can't
# be sandboxed the way a file path can. What stands in for it: a fail-closed
# key-combo denylist, and a confidence floor below which no actuation runs
# without a human's yes for that one action.

# Matched after normalizing to lowercase, sorted, '+'-joined form, so
# "Alt+F4" / "alt+f4" / "f4+alt" all match the same entry. Refused outright
# with permission_denied — the confirmation channel (orbit/confirmation.py)
# covers below-floor click targets only, never these — matching
# url_policy.yaml's fail-closed philosophy for blocklisted URLs. Widen this
# list carefully; it exists specifically to stop windows_key from being used
# to close an app or lock/interrupt the session out from under the user.
blocked_key_combos:
  - alt+f4
  - ctrl+alt+delete
  - ctrl+alt+del
  - win+l

# The "surface" threshold of orbit/tools/foundation.py's Confidence scale,
# reused rather than inventing a second number: any resolved ElementRef —
# UIA, OCR, vision, or the raw-{x,y} path (always scored at
# Confidence.VISION_INFERRED) — below this is refused with permission_denied
# by windows_click/windows_drag. The one way past it is a human's per-action
# yes: orbit/confirmation.py asks, and a single-use, short-lived approval
# token (approval_token_ttl_seconds below) lets exactly that action through.
# Nothing raises a score or lowers this line to get a click past it.
min_actuation_confidence: 0.70

# Whether a raw {x, y} click needs a human's per-action approval.
#
# true (shipped): a bare point the model picked by looking at a screenshot is
# treated exactly like a vision-guessed element. It is scored
# VISION_INFERRED, sits below min_actuation_confidence, and lands only with a
# human's yes for that one click — the same ask, token and expiry that
# perception_vision_locate's output goes through. This is Invariant 7 in the
# root CLAUDE.md, and tests/test_windows_control_tools.py reads this file to
# hold it.
#
# false: an OPT-IN unsupervised mode for screenshot-driven control, where one
# task issues dozens of coordinate clicks and a prompt per click is unusable —
# the human ends up rubber-stamping prompts they have stopped reading. While
# it is false, windows_click sends a bare {x, y} straight to the mouse with
# no confidence check and no token: the model can click anywhere on screen
# with nobody's yes. Only set it on a machine you are sitting at and watching,
# and set it back afterwards.
#
# What false does NOT relax: an already-resolved ElementRef carrying a
# below-floor `confidence` (e.g. straight out of perception_vision_locate)
# still needs approval, windows_drag never takes the unsupervised path (a raw
# endpoint there still needs an approval token), and windows_scroll refuses
# raw coordinates regardless.
confirm_raw_coordinate_clicks: true

# How long a human approval stays usable, in seconds.
#
# Short on purpose. An approval is consent about a SCREENSHOT OF A MOMENT:
# the human looked at a box drawn over a window and said "yes, that one".
# Windows move, dialogs open, focus changes. A token that outlived the screen
# it was granted against would aim an approved click at whatever happens to be
# there now — which is a worse failure than refusing, because it carries a
# human's yes.
#
# 120s is sized for "a person is sitting there answering", not for queued or
# deferred approval. Raising it materially weakens the guarantee; the GUI
# approval path does not need it raised, because a human approving in the
# dashboard is answering just as promptly.
approval_token_ttl_seconds: 120

# How long to wait for the GUI dashboard to answer a confirmation when there
# is no interactive console to ask on. 0 disables the GUI channel.
#
# The code default when this key is absent is 0 (orbit/confirmation.py), so a
# config that predates it fails closed immediately. The shipped value is 30:
# the dashboard polls for pending confirmations every 2 seconds and shows a
# screenshot with the proposed click target drawn as a blue box, and an
# unanswered request fails closed once the 30 seconds are up. Set back to 0
# for unattended runs (eval, CI) where a hang is worse than a refusal.
approval_gui_wait_seconds: 30
